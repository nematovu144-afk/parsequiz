databases:
  - name: parsequiz-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: parsequiz
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: parsequiz-db
          property: connectionString
