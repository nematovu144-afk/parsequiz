function ruPlural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return few;
  return many;
}

const COUNT_TEXTS = {
  questionsCount: {
    uz: (n) => `${n} ta savol`,
    ru: (n) => `${n} ${ruPlural(n, 'вопрос', 'вопроса', 'вопросов')}`,
    en: (n) => `${n} question${n === 1 ? '' : 's'}`,
  },
  needReview: {
    uz: (n) => `${n} ta tekshirish talab qiladi`,
    ru: (n) => `${n} ${ruPlural(n, 'требует', 'требуют', 'требуют')} проверки`,
    en: (n) => `${n} need${n === 1 ? 's' : ''} review`,
  },
  skippedNote: {
    uz: (n) => `${n} ta savol o'tkazib yuborildi — to'g'ri javob belgilanmagan.`,
    ru: (n) => `${n} ${ruPlural(n, 'вопрос', 'вопроса', 'вопросов')} пропущено — правильный ответ не отмечен.`,
    en: (n) => `${n} question${n === 1 ? '' : 's'} skipped — no correct answer marked.`,
  },
};

function resultFeedback(lang, pct) {
  if (lang === 'ru') {
    if (pct >= 80) return '🎉 Отлично!';
    if (pct >= 50) return '👍 Хорошо!';
    return '💪 Попробуйте ещё раз';

  if (lang === 'en') {
    if (pct >= 80) return '🎉 Excellent!';
    if (pct >= 50) return '👍 Good job!';
    return '💪 Keep practicing';
  }
  if (pct >= 80) return "🎉 Ajoyib!";
  if (pct >= 50) return "👍 Yaxshi natija!";
  return "💪 Yana urinib ko'ring";
}

function formatDuration(ms) {
  const totalSec = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

const LangContext = createContext({ lang: 'uz', setLang: () => {} });
function useLang() { return useContext(LangContext); }

function useT() {
  const { lang } = useLang();
  const dict = translations[lang] || translations.uz;
  const t = (key, vars) => {
    let str = dict[key];
    if (str === undefined) str = translations.en[key];
    if (str === undefined) return key;
    if (vars) Object.keys(vars).forEach((k) => { str = str.split(`{${k}}`).join(vars[k]); });
    return str;
  };
  const tFlag = (f) => (dict.flags && dict.flags[f]) || f;
  const tCount = (key, n) => COUNT_TEXTS[key][lang](n);
  return { t, tFlag, tCount, lang };
}

function LangProvider({ children }) {
  const [lang, setLangState] = useState(() => {
    const saved = localStorage.getItem('quizParserLang');
    return LANGS.includes(saved) ? saved : 'uz';
  });
  const setLang = (l) => { setLangState(l); localStorage.setItem('quizParserLang', l); };
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  return <LangContext.Provider value={{ lang, setLang }}>{children}</LangContext.Provider>;
}

function LanguageSwitcher() {
  const { lang, setLang } = useLang();
  return (
    <div className="inline-flex bg-gray-100 rounded-full p-1 gap-0.5" role="group" aria-label="Language">
      {LANGS.map((l) => (
        <button
          key={l}

          }`}
        >
          {LANG_NAMES[l]}
        </button>
      ))}
    </div>
  );
}

// ─── Upload Drop Zone ───────────────────────────────────────

function UploadZone({ onJobStarted, onError }) {
  const { t } = useT();
  const [dragging, setDragging] = useState(false);
  const [mode, setMode]         = useState('auto');
  const inputRef = useRef();

  const handleFile = useCallback(async (file) => {
    const form = new FormData();
    form.append('file', file);
    form.append('delimiter_mode', mode);
    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
      if (!res.ok) { const d = await res.json(); throw new Error(d.detail || res.statusText); }
      const data = await res.json();
      onJobStarted(data.job_id, file.name);
    } catch (e) { onError(e.message); }
  }, [mode, onJobStarted, onError]);

  const onDrop = (e) => {
    e.preventDefault(); setDragging(false);
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  };

  const modes = ['auto', 'bold', 'underline', 'plus', 'star', 'hash', 'checkbox'];

  return (
    <div>
      <div
        className={`drop-zone rounded-2xl p-14 text-center cursor-pointer ${dragging ? 'active' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={onDrop}
        onClick={() => inputRef.current.click()}
      >
        <svg className={`mx-auto mb-4 transition-transform duration-200 ${dragging ? 'scale-110 text-green-500' : 'text-gray-400'}`}
          width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 16V4m0 0L8 8m4-4l4 4M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" />
        </svg>
        <p className="text-gray-700 font-semibold">{t('dropText')}</p>
        <p className="text-gray-400 text-sm mt-1">{t('browseText')}</p>
        <input ref={inputRef} type="file" accept=".docx,.pdf,.txt" className="hidden"
          onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
      </div>

      <div className="mt-5 flex items-center justify-center gap-3 text-sm text-gray-500">
        <label className="font-medium">{t('detectionLabel')}:</label>
        <div className="relative">
          <select value={mode} onChange={(e) => setMode(e.target.value)}
            className="appearance-none border border-gray-200 rounded-lg pl-3 pr-8 py-1.5 bg-white text-sm text-gray-700 cursor-pointer hover:border-gray-300">
            {modes.map((m) => <option key={m} value={m}>{t(`mode_${m}`)}</option>)}
          </select>
          <svg className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>
  );
}

// ─── Poller ─────────────────────────────────────────────────

function Poller({ jobId, onDone, onError }) {
  const { t } = useT();
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    let active = true;
    const poll = async () => {
      try {
        const res = await fetch(`${API}/parse/${jobId}`);
        const data = await res.json();
        if (!active) return;
        setProgress(Math.round((data.progress || 0) * 100));
        if (data.status === 'done')   return onDone(data.questions);
        if (data.status === 'failed') return onError(data.error || t('parseFailed'));
        setTimeout(poll, 800);
      } catch (e) { if (active) onError(e.message); }
    };
    poll();
    return () => { active = false; };
  }, [jobId]);

  return (
    <div className="text-center py-20">
      <div className="inline-block w-12 h-12 border-4 border-green-100 border-t-green-600 rounded-full animate-spin mb-5" />
      <p className="text-gray-600 font-medium mb-4">{t('parsing', { progress })}</p>
      <div className="max-w-xs mx-auto progress-track h-1.5">
        <div className="progress-fill h-full" style={{ width: `${progress}%` }} />
      </div>
    </div>
  );
}

// ─── Editor ─────────────────────────────────────────────────

function Editor({ questions, setQuestions, filename, onReset, onPlay }) {
  const { t, tCount } = useT();
  const flagged  = questions.filter(q => q.flags && q.flags.length > 0).length;
  const total    = questions.length;

  const updateQ = (idx, patch) => {
    setQuestions(qs => qs.map((q, i) => i === idx ? { ...q, ...patch } : q));
  };

  const deleteQ = (idx) => {
    setQuestions(qs => qs.filter((_, i) => i !== idx));
  };

  const exportAs = async (fmt) => {
    const res = await fetch(`${API}/export`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questions, format: fmt }),
    });
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `quiz.${fmt === 'xlsx' ? 'xlsx' : fmt}`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      {/* Toolbar */}
      <div className="sticky top-3 z-10 card bg-white/90 backdrop-blur px-4 py-3 flex flex-wrap items-center justify-between gap-3 mb-6">
        <div className="flex flex-wrap items-center gap-3">
          <span className="font-bold text-lg text-gray-800">{tCount('questionsCount', total)}</span>
          {flagged > 0 && (
            <span className="flag-badge">{tCount('needReview', flagged)}</span>
          )}
          <span className="text-gray-400 text-sm truncate max-w-[160px]">{filename}</span>
        </div>
        <div className="flex flex-wrap gap-2">
          <button onClick={onPlay} className="btn-primary px-4 py-2 rounded-xl text-sm font-semibold">▶ {t('playBtn')}</button>
          <button onClick={() => exportAs('json')} className="btn-soft px-3 py-2 rounded-xl text-sm">JSON</button>
          <button onClick={() => exportAs('xlsx')} className="btn-soft px-3 py-2 rounded-xl text-sm">Excel</button>
          <button onClick={() => exportAs('csv')}  className="btn-soft px-3 py-2 rounded-xl text-sm">CSV</button>
          <button onClick={onReset} className="btn-ghost px-3 py-2 rounded-xl text-sm font-semibold">{t('newFileBtn')}</button>
        </div>
      </div>

      {/* Question cards */}
      <div className="space-y-4">
        {questions.map((q, qi) => (
          <QuestionCard key={q.id} q={q} idx={qi} updateQ={updateQ} deleteQ={deleteQ} />
        ))}
      </div>
    </div>
  );
}

// ─── Single Question Card ───────────────────────────────────

function QuestionCard({ q, idx, updateQ, deleteQ }) {
  const { t, tFlag } = useT();
  const isFlagged = q.flags && q.flags.length > 0;

  return (
    <div className={`card relative overflow-hidden p-5 ${isFlagged ? 'ring-1 ring-orange-200' : ''}`}>
      {isFlagged && <div className="absolute left-0 top-0 bottom-0 w-1 bg-orange-400" />}
      <div className="flex items-start gap-3">
        <div className="w-7 h-7 rounded-full bg-gray-100 text-gray-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5 select-none">{idx + 1}</div>
        <div className="flex-1 min-w-0">
          {/* Question text */}
          <textarea
            className="w-full border-0 text-gray-800 font-semibold resize-none bg-transparent leading-snug"
            rows={2}
            value={q.question}
            onChange={(e) => updateQ(idx, { question: e.target.value })}
          />

          {/* Flags */}
          {isFlagged && (
            <div className="flex flex-wrap gap-1 mb-3">
              {q.flags.map(f => <span key={f} className="flag-badge">{tFlag(f)}</span>)}
            </div>
          )}

          {/* Options */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
            {q.options.map((opt, oi) => {
              const isCorrect = q.correct_option_index === oi;
              return (
                <div key={oi}
                  className={`flex items-center gap-2 rounded-xl px-3 py-2 text-sm cursor-pointer border transition-colors
                    ${isCorrect ? 'correct-ring bg-green-50 border-green-300' : 'bg-gray-50 border-gray-200 hover:border-gray-300'}`}
                  onClick={() => updateQ(idx, { correct_option_index: oi })}
                >
                  <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 select-none ${isCorrect ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-500'}`}>
                    {String.fromCharCode(65 + oi)}
                  </span>
                  <input
                    className="flex-1 bg-transparent border-0 text-gray-700 min-w-0"
                    value={opt}
                    onClick={(e) => e.stopPropagation()}
                    onChange={(e) => {
                      const newOpts = [...q.options];
                      newOpts[oi] = e.target.value;
                      updateQ(idx, { options: newOpts });
                    }}
                  />
                  {isCorrect && (
                    <svg className="w-4 h-4 text-green-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" />
                    </svg>
                  )}
                </div>
              );
            })}
          </div>

          {/* Add option button */}
          {q.options.length < 6 && (
            <button
              className="text-xs text-green-700 font-semibold mt-2.5 hover:underline"
              onClick={() => updateQ(idx, { options: [...q.options, ''] })}
            >{t('addOption')}</button>
          )}

          {/* Explanation */}
          {q.explanation && (
            <div className="mt-3 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2">
              <span className="font-semibold">{t('explanationLabel')}:</span>{' '}
              <input
                className="bg-transparent border-0 text-gray-500 w-full italic"
                value={q.explanation}
                onChange={(e) => updateQ(idx, { explanation: e.target.value })}
              />
            </div>
          )}
        </div>

        {/* Delete button */}
        <button onClick={() => deleteQ(idx)}
          className="text-gray-300 hover:text-red-500 transition-colors mt-1 flex-shrink-0" title={t('deleteTitle')}>
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>
  );
}

// ─── Time Setup ─────────────────────────────────────────────

function TimeSetup({ onStart }) {
  const { t } = useT();
  const options = [15, 30, 60, null];
  return (
    <div className="max-w-md mx-auto text-center py-14 fade-in">
      <h2 className="text-xl font-bold text-gray-800 mb-2">{t('timeSetupHeading')}</h2>
      <p className="text-gray-500 text-sm mb-6">{t('timeSetupSubtitle')}</p>
      <div className="grid grid-cols-2 gap-3">
        {options.map((sec) => (
          <button
            key={sec === null ? 'none' : sec}
            onClick={() => onStart(sec)}
            className="card px-4 py-4 text-sm font-semibold text-gray-700 hover:ring-2 hover:ring-green-300"
          >
            {sec === null ? t('timeOptionNone') : t('timeOptionSeconds', { n: sec })}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Per-question countdown ─────────────────────────────────

function QuestionTimer({ duration, onExpire }) {
  const [remaining, setRemaining] = useState(duration);

  useEffect(() => {
    if (remaining <= 0) { onExpire(); return; }
    const id = setTimeout(() => setRemaining(r => r - 1), 1000);
    return () => clearTimeout(id);
  }, [remaining]);

  const pct = Math.max(0, (remaining / duration) * 100);
  return (
    <div className="flex items-center gap-2">
      <div className="progress-track h-1.5 w-20">
        <div
          className="progress-fill h-full"
          style={{ width: `${pct}%`, background: pct <= 25 ? 'var(--danger)' : undefined }}
        />
      </div>
      <span className="text-xs font-semibold text-gray-500 tabular-nums w-6 text-right">{remaining}s</span>
    </div>
  );
}

// ─── Play Quiz ──────────────────────────────────────────────

function PlayQuiz({ questions, onExit }) {
  const { t, tCount, lang } = useT();
  const order = React.useMemo(
    () => questions.filter(q =>
      q.correct_option_index !== null &&
      q.correct_option_index !== undefined &&
      q.correct_option_index >= 0 &&
      q.correct_option_index < q.options.length
    ),
    [questions]
  );
  const skipped = questions.length - order.length;

  const [phase, setPhase] = useState('setup'); // 'setup' | 'quiz' | 'results'
  const [duration, setDuration] = useState(null); // seconds per question, or null = no limit
  const [startTime, setStartTime] = useState(null);
  const [elapsedMs, setElapsedMs] = useState(0);

  const [index, setIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [attempted, setAttempted] = useState(0);
  const [wrongQuestions, setWrongQuestions] = useState([]);

  const startQuiz = (sec) => {
    setDuration(sec);
    setStartTime(Date.now());
    setIndex(0); setSelected(null); setScore(0); setAttempted(0); setWrongQuestions([]);
    setPhase('quiz');
  };

  const restart = () => setPhase('setup');

  const finalize = (finalScore, finalAttempted, finalWrong) => {
    setScore(finalScore);
    setAttempted(finalAttempted);
    setWrongQuestions(finalWrong);
    setElapsedMs(Date.now() - startTime);
    setPhase('results');
  };

  if (order.length === 0) {
    return (
      <div className="text-center py-20 fade-in">
        <p className="text-gray-600 mb-4">{t('noQuestionsToPlay')}</p>
        <button onClick={onExit} className="btn-ghost px-4 py-2 rounded-xl text-sm font-semibold">
          {t('back')}
        </button>
      </div>
    );
  }

  if (phase === 'setup') {
    return <TimeSetup onStart={startQuiz} />;
  }

  if (phase === 'results') {
    const pct = attempted > 0 ? Math.round((score / attempted) * 100) : 0;
    return (
      <div className="text-center py-8 fade-in max-w-2xl mx-auto">
        <h2 className="text-xl font-bold text-gray-500 mb-4">{t('resultHeading')}</h2>
        <div
          style={{ width: 140, height: 140, background: `conic-gradient(var(--accent-2) ${pct * 3.6}deg, #e2e8f0 0deg)` }}
          className="mx-auto mb-2 rounded-full flex items-center justify-center"
        >
          <div className="bg-white rounded-full w-[112px] h-[112px] flex flex-col items-center justify-center">
            <span className="text-3xl font-extrabold text-gray-800">{pct}%</span>
            <span className="text-xs text-gray-400">{score}/{attempted}</span>
          </div>
        </div>
        <p className="text-lg font-semibold mb-3">{resultFeedback(lang, pct)}</p>
        <div className="flex justify-center gap-4 text-xs text-gray-500 mb-6">
          <span className="bg-gray-100 rounded-full px-3 py-1 font-semibold">{t('attemptedLabel')}: {attempted}/{order.length}</span>
          <span className="bg-gray-100 rounded-full px-3 py-1 font-semibold">{t('timeSpentLabel')}: {formatDuration(elapsedMs)}</span>
        </div>
        {wrongQuestions.length > 0 && (
          <div className="text-left mt-6 space-y-2">
            <p className="font-semibold text-gray-700">{t('wrongAnswersLabel')}:</p>
            {wrongQuestions.map((w, i) => (
              <div key={i} className="card bg-red-50/60 border border-red-100 p-3 text-sm">
                <p className="font-medium text-gray-800">{w.question}</p>
                <p className="text-red-600">{t('yourAnswer')}: {w.yourAnswer}</p>
                <p className="text-green-700">{t('correctAnswer')}: {w.correctAnswer}</p>
              </div>
            ))}
          </div>
        )}
        <div className="flex justify-center gap-3 mt-8">
          <button onClick={restart} className="btn-primary px-4 py-2 rounded-xl text-sm font-semibold">{t('playAgain')}</button>
          <button onClick={onExit} className="btn-ghost px-4 py-2 rounded-xl text-sm font-semibold">
            {t('backToEdit')}
          </button>
        </div>
      </div>
    );
  }

  // ── phase === 'quiz' ──

  const q = order[index];
  const isLast = index === order.length - 1;

  const answer = (oi) => {
    if (selected !== null) return;
    setSelected(oi);
    setAttempted(a => a + 1);
    if (oi === q.correct_option_index) {
      setScore(s => s + 1);
    } else {
      setWrongQuestions(w => [...w, {
        question: q.question,
        yourAnswer: q.options[oi],
        correctAnswer: q.options[q.correct_option_index],
      }]);
    }
  };

  const expire = () => {
    if (selected !== null) return;
    setSelected(-1);
    setAttempted(a => a + 1);
    setWrongQuestions(w => [...w, {
      question: q.question,
      yourAnswer: t('timeUp'),
      correctAnswer: q.options[q.correct_option_index],
    }]);
  };

  const next = () => {
    if (isLast) {
      finalize(score, attempted, wrongQuestions);
      return;
    }
    setIndex(i => i + 1);
    setSelected(null);
  };

  return (
    <div className="max-w-2xl mx-auto">
      {skipped > 0 && index === 0 && (
        <p className="text-xs text-gray-400 mb-3">{tCount('skippedNote', skipped)}</p>
      )}
      <div className="progress-track h-1.5 mb-4">
        <div className="progress-fill h-full" style={{ width: `${((index + (selected !== null ? 1 : 0)) / order.length) * 100}%` }} />
      </div>
      <div className="flex justify-between items-center mb-4 text-sm text-gray-500">
        <span>{t('questionCounter', { i: index + 1, total: order.length })}</span>
        <div className="flex items-center gap-3">
          {duration !== null && selected === null && <QuestionTimer key={index} duration={duration} onExpire={expire} />}
          <span className="bg-gray-100 rounded-full px-3 py-1 font-semibold">{t('scoreLabel')}: {score}</span>
        </div>
      </div>
      <div key={index} className="card fade-in p-6">
        <p className="font-semibold text-gray-800 mb-4 text-lg leading-snug">{q.question}</p>
        <div className="space-y-2">
          {q.options.map((opt, oi) => {
            let cls = 'bg-gray-50 border-gray-200 hover:bg-gray-100';
            if (selected !== null) {
              if (oi === q.correct_option_index) cls = 'correct-ring bg-green-50 border-green-300';
              else if (oi === selected) cls = 'bg-red-50 border-red-300';
            }
            return (
              <div
                key={oi}
                onClick={() => answer(oi)}
                className={`flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm border cursor-pointer transition-colors ${cls}`}
              >
                <span className="w-6 h-6 rounded-full bg-white border border-gray-200 flex items-center justify-center text-xs font-bold flex-shrink-0 text-gray-500 select-none">
                  {String.fromCharCode(65 + oi)}
                </span>
                <span className="flex-1">{opt}</span>
              </div>
            );
          })}
        </div>
        <div className="mt-5 flex items-center justify-between">
          <button
            onClick={() => finalize(score, attempted, wrongQuestions)}
            className="text-xs text-gray-400 hover:text-red-500 font-semibold underline"
          >{t('finishTest')}</button>
          {selected !== null && (
            <button onClick={next} className="btn-primary px-5 py-2 rounded-xl text-sm font-semibold">
              {isLast ? t('viewResults') : `${t('nextBtn')} →`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(
  <LangProvider><App /></LangProvider>,
  document.getElementById('root')
);
</script>
</body>
</html>
